<div class="carousel">

  <button
      class="nav prev"
      (click)="previous()">
    ❮
  </button>

  <div class="viewport">

    <img
        [ngSrc]="currentImage()"
        width="1200"
        height="700"
        alt="Carousel image"
        priority>

  </div>

  <button
      class="nav next"
      (click)="next()">
    ❯
  </button>

</div>

<div class="dots">

  @for(image of images; track image; let i = $index) {

    <button
        class="dot"
        [class.active]="i === currentIndex()"
        (click)="goTo(i)">
    </button>

  }

</div>
