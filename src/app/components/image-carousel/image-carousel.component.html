<div class="carousel">

  <button
      class="nav prev"
      (click)="previous()">
    ❮
  </button>

  <div class="viewport">

    <img
        [src]="currentImage()"
        alt="Carousel image"
        priority>

  </div>

  <button
      class="nav next"
      (click)="next()">
    ❯
  </button>

</div>
@if (dots) {
  <div class="dots">

    @for(image of images; track image; let i = $index) {

      <button
          class="dot"
          [class.active]="i === currentIndex()"
          (click)="goTo(i)">
      </button>

    }

  </div>
}
