<section
    class="image-text"
    [class.image-left]="imageSide === 'left'"
    [class.image-right]="imageSide === 'right'"
>
  <div
      class="image-text__image"
      [class.display-none-mobile]="!mobileImages"
  >
    <img
        [src]="image"
        alt=""
    />
  </div>

  <div class="image-text__content">
    <ng-content></ng-content>
  </div>
</section>
